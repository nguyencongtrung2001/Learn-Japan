<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="frontCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="100" height="100" rx="24" fill="url(#bg)" />

  <!-- Back tilted Flashcard -->
  <rect x="23" y="21" width="46" height="58" rx="8" transform="rotate(-12 46 50)" fill="#ffffff" fill-opacity="0.32" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Front Flashcard with drop shadow -->
  <rect x="30" y="21" width="46" height="58" rx="8" fill="url(#frontCard)" filter="url(#shadow)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Card line accent -->
  <rect x="37" y="28" width="32" height="3" rx="1.5" fill="#cbd5e1" />

  <!-- Lightning Bolt (⚡ Flash) -->
  <path d="M55 36 L43 51 L51 51 L47 69 L63 48 L54 48 Z" fill="url(#bolt)" stroke="#d97706" stroke-width="0.8" stroke-linejoin="round" />
</svg>
